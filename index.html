<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="culturama-favico.png" type="image/png">
    <title>Pesquisa culturama</title>
</head>
<body>

<header>
    <h1>Pesquisa online</h1>
    <img src="logo-culturama.png" alt="logo-site">
</header>

<section class="container">

    <form action="" method="get">

        <fieldset>
            <legend>Informações pessoais</legend>

            <label>Nome:</label>
            <input type="text" required>

            <label>Idade:</label>
            <input type="number" min="12" max="100" required>

            <label>Data de nascimento:</label>
            <input type="date">

            <label>Email:</label>
            <input type="email" required>

            <label>Telefone:</label>
            <input type="tel" placeholder="(11) 99999-9999">

            <label>Foto de perfil:</label>
            <input type="file" accept="image/*">
        </fieldset>

        <fieldset>
            <legend>Perfil</legend>

            <p>Gênero:</p>
            <label><input type="radio" name="gender"> Masculino</label>
            <label><input type="radio" name="gender"> Feminino</label>
            <label><input type="radio" name="gender"> Prefiro não informar</label>

            <br>

            <label>Estado civil:</label>
            <select>
                <option>Selecione</option>
                <option>Solteiro</option>
                <option>Casado</option>
                <option>Divorciado</option>
            </select>

            <label>Estado:</label>
            <select>
                <option>Selecione</option>
                <option>São Paulo</option>
                <option>Rio de Janeiro</option>
                <option>Minas Gerais</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Hábitos</legend>

            <p>Redes sociais:</p>
            <label><input type="checkbox"> Instagram</label>
            <label><input type="checkbox"> Facebook</label>
            <label><input type="checkbox"> TikTok</label>

            <label>Estilo musical:</label>
            <select>
                <option>Selecione</option>
                <option>Trap</option>
                <option>Sertanejo</option>
                <option>Samba</option>
                <option>Pagode</option>
            </select>

            <label>Comentários:</label>
            <textarea rows="4" placeholder="Digite aqui..."></textarea>
        </fieldset>

        <div class="buttons">
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </div>

    </form>

</section>


</body>
</html>
